# Publishes the browser installer (web/) to GitHub Pages with the latest release's
# firmware files next to it. ESP Web Tools needs them on the same origin, since
# GitHub release downloads don't send CORS headers.
name: Web installer

on:
  release:
    types: [published]
  push:
    branches: [main]
    paths: [web/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Fetch latest release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p site
          cp web/* site/
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName -q .tagName)
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir site \
            --pattern 'flash.txt' --pattern '*.bin'
          parts=""
          while read -r addr file; do
            [ -n "$file" ] || continue
            parts="${parts:+$parts,}{\"path\":\"$file\",\"offset\":$((addr))}"
          done < site/flash.txt
          cat > site/manifest.json <<EOF
          {
            "name": "AdhanBox",
            "version": "$tag",
            "new_install_prompt_erase": true,
            "builds": [{ "chipFamily": "ESP32-S3", "parts": [$parts] }]
          }
          EOF
          cat site/manifest.json

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
