# EzanBox city list. Row order is the on-device list order:
# Istanbul first, Berlin second (default), then one city per UTC offset, west to east.
# diyanet_id = district ("ilçe") ID from ezanvakti.emushaf.net /ilceler/{sehirId}.
# tz = IANA zone; the POSIX TZ string is generated from the system zoneinfo by `cargo xtask cities`.
# −03:30 (St. John's) is omitted: Diyanet has no entry for Newfoundland.

default = "berlin"

[[city]]
key = "istanbul"
name = "Istanbul"
tz = "Europe/Istanbul"
diyanet_id = 9541

